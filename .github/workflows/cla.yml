name: CLA

# CLA Assistant Lite: a contributor signs the Contributor Licence Agreement (CLA.md) once by
# posting the sign-off comment on their first pull request; signatures are committed to the
# unprotected `cla-signatures` branch. pull_request_target runs with the base repository's
# token so it can comment and record signatures on pull requests from forks. It never checks
# out or runs code from the pull request, which keeps that trigger safe; do not add a checkout.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/jcaol/agent2kb/blob/main/CLA.md
          branch: cla-signatures
          allowlist: dependabot[bot],github-actions[bot]
